# Dependabot (ADR 0034): avisa de las versiones nuevas una vez por semana, en
# un PR por ecosistema, y espera unos días antes de proponerlas, como
# minimumReleaseAge en pnpm. Los submódulos de vendor/ no: sus versiones son
# las de las herramientas oficiales con las que se compara (make equivalencia).
#
# En pausa desde la 1.0.0 (2026-10-27): open-pull-requests-limit 0 apaga las propuestas de
# versión, que se retoman de una en una cuando se decida. Las actualizaciones de SEGURIDAD van
# aparte y siguen funcionando.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: [/, /frontend, /web]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]
