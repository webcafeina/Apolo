# La puerta: formato, clippy, pruebas, contraste e interfaz, con la ventana incluida.
name: Comprobar

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (webkit para la ventana)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev pkg-config nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # La interfaz va primero: src-tauri embebe frontend/dist al compilar.
      - run: make comprobar

  # La promesa de la ADR 0002: el mismo fichero que el cwebp oficial, byte a
  # byte. Descarga el cwebp de Google y comprueba su sha256 (make equivalencia).
  equivalencia:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: equivalencia
      - run: make equivalencia
