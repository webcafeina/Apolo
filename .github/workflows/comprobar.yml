# La puerta: formato, clippy, pruebas, contraste e interfaz, con la ventana incluida.
name: Comprobar

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: true

# Solo leer: ningún trabajo escribe en el repositorio (ADR 0034).
permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Dependencias del sistema (webkit para la ventana)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev pkg-config nasm

      # libjxl se compila con clang 18, como el cjxl oficial (ADR 0021): con
      # gcc, cjxl da otros bytes.
      - name: clang 18
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 18
          echo "APOLO_CLANG=/usr/lib/llvm-18/bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            web/pnpm-lock.yaml

      # make seguridad (ADR 0034): zizmor con uv, y cargo-deny.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny

      # La interfaz va primero: src-tauri embebe frontend/dist al compilar. La
      # web (web/, ADR 0033) va dentro de make comprobar.
      - run: make comprobar

  # La interfaz de punta a punta en un navegador, contra apolo-dev (ADR 0013).
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y nasm
      # libjxl se compila con clang 18, como el cjxl oficial (ADR 0021): con
      # gcc, cjxl da otros bytes.
      - name: clang 18
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 18
          echo "APOLO_CLANG=/usr/lib/llvm-18/bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm -C frontend install --frozen-lockfile
      - run: pnpm -C frontend exec playwright install --with-deps chromium
      - run: make e2e
      # La web (web/, ADR 0033), con el mismo Chromium.
      - run: make web-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: informe-e2e
          path: frontend/playwright-report/

  # La promesa de las ADR 0002, 0020 y 0021: el mismo fichero que cwebp,
  # cjpeg, oxipng, qoiconv, avifenc y cjxl oficiales, byte a byte. Descarga o
  # compila cada referencia y comprueba su sha256 (make equivalencia).
  equivalencia:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y nasm
      # libjxl se compila con clang 18, como el cjxl oficial (ADR 0021): con
      # gcc, cjxl da otros bytes.
      - name: clang 18
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 18
          echo "APOLO_CLANG=/usr/lib/llvm-18/bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: equivalencia
      - run: make equivalencia
