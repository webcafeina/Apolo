# Pruebas de humo de lo empaquetado (entrega 8a, ADR 0024): lo que nadie ve en un equipo,
# Windows x64 y Linux. pruebas/humo/humo.py trabaja en una carpeta con tildes y eñes (también la
# temporal), compara la CLI con las herramientas oficiales byte a byte, habla con apolo-mcp y, en
# Windows, actualiza con un apolo-mcp.exe en marcha.
#
# La llama publicar.yml con sus paquetes; a mano, con los de una ejecución anterior de Publicar
# (su número), para no compilar todo otra vez.
name: Humo

on:
  workflow_call:
    inputs:
      ejecucion:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ejecucion:
        description: "Número de la ejecución de Publicar con los paquetes"
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"

jobs:
  humo-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ejecucion }}
          github-token: ${{ github.token }}
          name: apolo-windows-x64
          path: paquete
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ejecucion }}
          github-token: ${{ github.token }}
          name: cli-windows-x64
          path: cli
      - name: Las herramientas oficiales de Windows
        run: |
          mkdir -p ref cli/x && cd ref
          curl -sSfL -o webp.zip https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-windows-x64.zip
          curl -sSfL -o avif.zip https://github.com/AOMediaCodec/libavif/releases/download/v1.4.2/windows-artifacts.zip
          curl -sSfL -o jxl.zip https://github.com/libjxl/libjxl/releases/download/v0.12.0/jxl-x64-windows-static.zip
          for z in *.zip; do 7z x -y -o"${z%.zip}" "$z" > /dev/null; done
          find . -iname "cwebp.exe" -o -iname "avifenc.exe" -o -iname "cjxl.exe"
          cd ../cli && 7z x -y -ox *.zip > /dev/null && ls x
      - name: Instalar Apolo en silencio
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse paquete -Filter *-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $exe.FullName -ArgumentList '/S'
          Get-ChildItem "$env:LOCALAPPDATA\Apolo"
          if (-not (Test-Path "$env:LOCALAPPDATA\Apolo\apolo-app.exe")) { throw "falta apolo-app.exe" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Apolo\apolo-mcp.exe")) { throw "falta apolo-mcp.exe" }
      - name: Humo
        run: |
          w() { cygpath -w "$1"; }
          r() { find ref -iname "$1" | head -1; }
          inst=$(find paquete -name "*-setup.exe" | head -1)
          mcp="$LOCALAPPDATA\Apolo\apolo-mcp.exe"
          python pruebas/humo/humo.py --cli cli/x --mcp "$mcp" \
            --cwebp "$(r cwebp.exe)" --avifenc "$(r avifenc.exe)" --cjxl "$(r cjxl.exe)" \
            --reinstalar "$(w "$inst")" --instalado "$mcp" --solo-informar-equivalencia

  humo-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ejecucion }}
          github-token: ${{ github.token }}
          name: apolo-linux-amd64
          path: paquete
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ejecucion }}
          github-token: ${{ github.token }}
          name: cli-linux-amd64
          path: cli
      - name: Instalar el .deb y abrir la AppImage
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y "$(find "$PWD/paquete" -name '*.deb' | head -1)"
          ls -la /usr/bin/apolo-app /usr/bin/apolo-mcp
          app=$(find "$PWD/paquete" -name '*.AppImage' | head -1)
          chmod +x "$app" && mkdir appimage && (cd appimage && "$app" --appimage-extract > /dev/null)
          ls appimage/squashfs-root/usr/bin/
          mkdir cli/x && tar xzf cli/*.tar.gz -C cli/x
      - name: Las herramientas oficiales de Linux
        run: |
          mkdir ref && cd ref
          curl -sSfL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-linux-x86-64.tar.gz | tar xz
          curl -sSfL -o avif.zip https://github.com/AOMediaCodec/libavif/releases/download/v1.4.2/linux-artifacts.zip && unzip -oq avif.zip -d avif
          find . -name cwebp -o -name avifenc
      - name: Humo
        run: |
          r() { find ref -name "$1" -type f | head -1; }
          chmod +x "$(r avifenc)"
          python3 pruebas/humo/humo.py --cli cli/x --mcp /usr/bin/apolo-mcp \
            --mcp appimage/squashfs-root/usr/bin/apolo-mcp \
            --cwebp "$(r cwebp)" --avifenc "$(r avifenc)"

  # Linux ARM64: la equivalencia con cwebp (siguiente.md) y el .deb de arm64.
  humo-linux-arm:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ejecucion }}
          github-token: ${{ github.token }}
          name: apolo-linux-arm64
          path: paquete
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ejecucion }}
          github-token: ${{ github.token }}
          name: cli-linux-arm64
          path: cli
      - name: Instalar el .deb, y cwebp oficial
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y "$(find "$PWD/paquete" -name '*.deb' | head -1)"
          mkdir cli/x && tar xzf cli/*.tar.gz -C cli/x
          mkdir ref && curl -sSfL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-linux-aarch64.tar.gz | tar xz -C ref
      - name: Humo
        run: python3 pruebas/humo/humo.py --cli cli/x --mcp /usr/bin/apolo-mcp --cwebp "$(find ref -name cwebp -type f | head -1)"


  # Fedora (ADR 0030): el .rpm firmado se instala con dnf, con sus dependencias, y al binario no
  # le falta ninguna librería. La ventana no se abre (no hay pantalla).
  humo-fedora:
    strategy:
      fail-fast: false
      matrix:
        include:
          - maquina: ubuntu-22.04
            paquete: apolo-linux-amd64
          - maquina: ubuntu-22.04-arm
            paquete: apolo-linux-arm64
    runs-on: ${{ matrix.maquina }}
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ejecucion }}
          github-token: ${{ github.token }}
          name: ${{ matrix.paquete }}
          path: paquete
      - name: Instalar el .rpm
        run: |
          rpm=$(find "$PWD/paquete" -name '*.rpm' | head -1)
          rpm --import empaquetado/linux/apolo.asc
          rpm --checksig "$rpm"
          rpm -qpR "$rpm"
          dnf install -y "$rpm"
          /usr/bin/apolo-mcp --version
          test -x /usr/bin/apolo-app
          if ldd /usr/bin/apolo-app | grep "not found"; then exit 1; fi
          test -f /usr/share/metainfo/com.webcafeina.apolo.metainfo.xml

  # Arch (ADR 0030): el PKGBUILD del AUR, rellenado con el .deb de esta ejecución, se construye con
  # makepkg y se instala con pacman. La imagen de Arch solo existe para x86_64.
  humo-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Herramientas
        run: pacman -Syu --noconfirm --needed base-devel python webkit2gtk-4.1 gtk3 hicolor-icon-theme > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.ejecucion }}
          github-token: ${{ github.token }}
          name: apolo-linux-amd64
          path: paquete
      - name: El PKGBUILD, con el .deb de aquí
        run: |
          deb=$(find "$PWD/paquete" -name '*_amd64.deb' | head -1)
          version=$(basename "$deb" | sed 's/^Apolo_\(.*\)_amd64\.deb$/\1/')
          mkdir aur && cp "$deb" aur/
          (cd aur && sha256sum "$(basename "$deb")" > sumas.txt && echo "0  Apolo_${version}_arm64.deb" >> sumas.txt)
          python3 -I empaquetado/aur/rellenar.py "$version" aur/sumas.txt aur/PKGBUILD
          sed -i 's|https://github.com/webcafeina/Apolo/releases/download/v${pkgver}/||' aur/PKGBUILD
          useradd -m constructor && chown -R constructor aur
      - name: makepkg y pacman
        run: |
          su constructor -c "cd aur && makepkg --noconfirm"
          pacman -U --noconfirm aur/apolo-bin-*.pkg.tar.zst
          pacman -Qi apolo-bin
          test "$(cat /usr/share/apolo/gestor)" = pacman
          /usr/bin/apolo-mcp --version
          if ldd /usr/bin/apolo-app | grep "not found"; then exit 1; fi
