# Los instaladores y la CLI de los seis objetivos (ADR 0010 y 0014).
#
# - Al empujar una etiqueta vX.Y.Z: borrador de Release con todo colgado, las
#   notas de .github/notas/vX.Y.Z.md, SHA256SUMS.txt y el latest.json del
#   actualizador (ADR 0018). Desde la v0.3.3 son versiones normales, no
#   pre-release: el actualizador pregunta por la «última» de GitHub, y esa
#   nunca es una pre-release. El borrador se publica a mano, después de mirarlo.
# - A mano (workflow_dispatch): solo compila y deja los paquetes como artefactos.
name: Publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Cada trabajo pide lo suyo (ADR 0034).
permissions: {}

jobs:
  paquete:
    # tauri-action crea el borrador de la Release y sube los paquetes.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15: GitHub retira macos-14 el 2026-11-02, con apagones antes
          # (deuda). El mínimo de macOS se fija abajo, con despliegue.
          - nombre: macos-universal
            maquina: macos-15
            objetivo: universal-apple-darwin
            rust: aarch64-apple-darwin,x86_64-apple-darwin
            despliegue: "11.0"
          - nombre: windows-x64
            maquina: windows-latest
            objetivo: x86_64-pc-windows-msvc
            rust: x86_64-pc-windows-msvc
          - nombre: windows-arm64
            maquina: windows-11-arm
            objetivo: aarch64-pc-windows-msvc
            rust: aarch64-pc-windows-msvc
          # Ubuntu 22.04: glibc 2.35, la de Debian 12 o menor.
          - nombre: linux-amd64
            maquina: ubuntu-22.04
            objetivo: x86_64-unknown-linux-gnu
            rust: x86_64-unknown-linux-gnu
          - nombre: linux-arm64
            maquina: ubuntu-22.04-arm
            objetivo: aarch64-unknown-linux-gnu
            rust: aarch64-unknown-linux-gnu

    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.maquina }}
    # El macOS mínimo de todo lo que se compila, también lo que compila CMake
    # (libjxl, aom, libheif…): sin fijarlo, cada Xcode pone el de su SDK, y
    # Apolo promete macOS 11. En Windows y Linux va vacío y no cuenta.
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.despliegue }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true

      - name: Dependencias del sistema
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev pkg-config file

      # mozjpeg compila su SIMD de x86 con nasm.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      # El fondo del .dmg en un TIFF HiDPI (1x + 2x): con un PNG suelto, macOS
      # lo escala y en Retina se ve borroso. Los PNG están en git (make iconos);
      # el TIFF solo se hace aquí, que es donde hay tiffutil.
      - name: Fondo del .dmg
        if: runner.os == 'macOS'
        run: |
          tiffutil -cathidpicheck empaquetado/macos/fondo-dmg.png empaquetado/macos/fondo-dmg@2x.png \
            -out empaquetado/macos/fondo-dmg.tiff

      # libjxl se compila con clang 18, como el cjxl oficial (ADR 0021): con
      # gcc, cjxl da otros bytes.
      - name: clang 18
        if: runner.os == 'Linux'
        run: |
          sudo bash .github/llvm.sh 18
          echo "APOLO_CLANG=/usr/lib/llvm-18/bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.objetivo }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend install --frozen-lockfile

      # apolo-mcp va dentro de cada instalador (ADR 0023), junto a la
      # aplicación: así un agente que apunta ahí se actualiza con ella. Tauri lo
      # busca como src-tauri/binaries/apolo-mcp-<triple> y solo con
      # tauri.mcp.conf.json, que se fusiona aquí (trampas.md).
      - name: apolo-mcp, el servidor para agentes
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.nombre }}" = macos-universal ]; then
            cargo build --release -p apolo-mcp --target aarch64-apple-darwin
            cargo build --release -p apolo-mcp --target x86_64-apple-darwin
            lipo -create -output src-tauri/binaries/apolo-mcp-universal-apple-darwin \
              target/aarch64-apple-darwin/release/apolo-mcp target/x86_64-apple-darwin/release/apolo-mcp
            # Tauri compila cada arquitectura por separado y cada una puede
            # buscar el suyo: van los tres.
            for a in aarch64 x86_64; do
              cp target/$a-apple-darwin/release/apolo-mcp src-tauri/binaries/apolo-mcp-$a-apple-darwin
            done
          else
            E=${{ runner.os == 'Windows' && '.exe' || '' }}
            cargo build --release -p apolo-mcp --target ${{ matrix.objetivo }}
            cp target/${{ matrix.objetivo }}/release/apolo-mcp$E src-tauri/binaries/apolo-mcp-${{ matrix.objetivo }}$E
          fi

      # La interfaz se compila aquí, sin ningún secreto en el entorno: si la
      # compilara tauri-action (beforeBuildCommand), el código npm del frontend
      # correría con las claves de firma a mano. tauri.publicar.conf.json quita
      # ese paso (ADR 0034).
      - name: La interfaz, sin secretos
        run: pnpm -C frontend build

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La firma del actualizador (ADR 0018), que no es la de Apple ni la de
          # Windows: minisign, con la clave pública en tauri.conf.json. Sin
          # ella no salen los .sig y la aplicación no acepta la versión nueva.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # La firma GPG del .rpm (ADR 0030), con la misma clave que los
          # repositorios APT y RPM de apolo.webcafeina.com (web.yml).
          TAURI_SIGNING_RPM_KEY: ${{ secrets.PAQUETES_GPG_CLAVE }}
          TAURI_SIGNING_RPM_KEY_PASSPHRASE: ${{ secrets.PAQUETES_GPG_FRASE }}
          # Firma de sistema (ADR 0009): desactivada mientras no existan las cuentas.
          # Para activarla, crear estos secretos y quitar el comentario:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows (Azure Trusted Signing): bundle.windows.signCommand en tauri.conf.json.
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Apolo ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # En Windows solo hay NSIS, pero si algún día hay .msi, el
          # actualizador sigue con el instalador con el que se instaló.
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.objetivo }} --config src-tauri/tauri.mcp.conf.json --config src-tauri/tauri.publicar.conf.json

      # El paquete de Claude Desktop, con el mismo apolo-mcp. Instalado una vez,
      # le cede el turno al de la aplicación (relevo.rs), que es el que se
      # actualiza. Uno por objetivo: Apolo-0.8.0-windows-arm64.mcpb.
      - name: El .mcpb de Claude Desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Los de la Release, en inglés (ADR 0025): las descripciones de su
          # manifiesto. El que crea la ventana va en el idioma de la ventana.
          APOLO_IDIOMA: en
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$RUNNER_OS" in macOS) S=macos;; Windows) S=windows;; *) S=linux;; esac
          B=$(ls src-tauri/binaries/apolo-mcp-* | grep -v -e aarch64-apple -e x86_64-apple)
          # Con el objetivo del sidecar, ya compilado: sin él, cargo lo
          # rehace todo (libjxl incluida) para la máquina.
          T=${{ matrix.nombre == 'macos-universal' && 'aarch64-apple-darwin' || matrix.objetivo }}
          hecho=$(cargo run -q --release -p apolo-mcpb --target $T -- "$B" "$V" $S mcpb)
          N=mcpb/Apolo-$V-${{ matrix.nombre == 'macos-universal' && 'macos' || matrix.nombre }}.mcpb
          mv "$hecho" "$N"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            for intento in 1 2 3 4; do
              gh release upload "$GITHUB_REF_NAME" "$N" --clobber && break
              [ "$intento" = 4 ] && exit 1
              sleep $(( intento * 15 ))
            done
          fi

      # El icono del volumen montado: el disco con el sol, como Esfinge. Tauri
      # pone el de la aplicación y no deja elegir otro, así que se cambia en el
      # .dmg ya hecho (empaquetado/macos/icono-volumen.sh). Con etiqueta, el
      # .dmg ya está en la Release y se vuelve a subir encima.
      - name: Icono del volumen
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls target/${{ matrix.objetivo }}/release/bundle/dmg/*.dmg)
          empaquetado/macos/icono-volumen.sh "$dmg"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # La API de GitHub da a veces un 502 pasajero al reemplazar un
            # fichero de la Release (pasó con la v0.3.2): se reintenta.
            for intento in 1 2 3 4; do
              gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber && break
              [ "$intento" = 4 ] && exit 1
              sleep $(( intento * 15 ))
            done
          fi

      # También con etiqueta: los usan las pruebas de humo (abajo).
      - name: Paquetes como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apolo-${{ matrix.nombre }}
          path: |
            target/${{ matrix.objetivo }}/release/bundle/dmg/*.dmg
            target/${{ matrix.objetivo }}/release/bundle/nsis/*.exe
            target/${{ matrix.objetivo }}/release/bundle/deb/*.deb
            target/${{ matrix.objetivo }}/release/bundle/rpm/*.rpm
            target/${{ matrix.objetivo }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.objetivo }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.objetivo }}/release/bundle/*/*.sig
            mcpb/*.mcpb
          if-no-files-found: error

  # La línea de comandos `apolo`, suelta, para los mismos seis objetivos.
  cli:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: macos-universal
            maquina: macos-15
            rust: aarch64-apple-darwin,x86_64-apple-darwin
            despliegue: "11.0"
          - nombre: windows-x64
            maquina: windows-latest
            objetivo: x86_64-pc-windows-msvc
            rust: x86_64-pc-windows-msvc
          - nombre: windows-arm64
            maquina: windows-11-arm
            objetivo: aarch64-pc-windows-msvc
            rust: aarch64-pc-windows-msvc
          - nombre: linux-amd64
            maquina: ubuntu-22.04
            objetivo: x86_64-unknown-linux-gnu
            rust: x86_64-unknown-linux-gnu
          - nombre: linux-arm64
            maquina: ubuntu-22.04-arm
            objetivo: aarch64-unknown-linux-gnu
            rust: aarch64-unknown-linux-gnu

    name: cli-${{ matrix.nombre }}
    runs-on: ${{ matrix.maquina }}
    # El macOS mínimo de todo lo que se compila, también lo que compila CMake
    # (libjxl, aom, libheif…): sin fijarlo, cada Xcode pone el de su SDK, y
    # Apolo promete macOS 11. En Windows y Linux va vacío y no cuenta.
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.despliegue }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      # libjxl se compila con clang 18, como el cjxl oficial (ADR 0021): con
      # gcc, cjxl da otros bytes.
      - name: clang 18
        if: runner.os == 'Linux'
        run: |
          sudo bash .github/llvm.sh 18
          echo "APOLO_CLANG=/usr/lib/llvm-18/bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli-${{ matrix.nombre }}

      - name: Compilar
        shell: bash
        run: |
          mkdir -p dist
          # La CLI y, con ella, apolo-mcp: quien use la CLI sin la aplicación
          # también puede dárselo a un agente (ADR 0023).
          if [ "${{ matrix.nombre }}" = macos-universal ]; then
            for b in apolo-cli apolo-mcp; do
              cargo build --release -p $b --target aarch64-apple-darwin
              cargo build --release -p $b --target x86_64-apple-darwin
            done
            for f in apolo apolo-mcp; do
              lipo -create -output dist/$f \
                target/aarch64-apple-darwin/release/$f target/x86_64-apple-darwin/release/$f
            done
          else
            E=${{ runner.os == 'Windows' && '.exe' || '' }}
            cargo build --release -p apolo-cli -p apolo-mcp --target ${{ matrix.objetivo }}
            cp target/${{ matrix.objetivo }}/release/apolo$E target/${{ matrix.objetivo }}/release/apolo-mcp$E dist/
          fi

      - name: Empaquetar
        shell: bash
        run: |
          V=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || V=prueba
          N=apolo-cli-$V-${{ matrix.nombre }}
          cp LICENSE dist/
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "../$N.zip" apolo.exe apolo-mcp.exe LICENSE > /dev/null
          else
            tar czf "../$N.tar.gz" apolo apolo-mcp LICENSE
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.nombre }}
          path: apolo-cli-*
          if-no-files-found: error

  # Pruebas de humo de lo empaquetado (entrega 8a, ADR 0024), en humo.yml: también se lanza a mano
  # contra los paquetes de una ejecución anterior. No frenan la Release (sigue en borrador hasta
  # revisarla); se miran al revisarla.
  humo:
    needs: [paquete, cli]
    # Para que humo.yml baje los paquetes de esta ejecución.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/humo.yml # zizmor: ignore[self-repository]
    with:
      ejecucion: ${{ github.run_id }}

  # Con todo compilado: la CLI a la Release, las notas y las sumas.
  adjuntar:
    if: github.ref_type == 'tag'
    needs: [paquete, cli]
    runs-on: ubuntu-latest
    # Los de todo el workflow, más los de la procedencia (ADR 0034).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli
      # tauri-action escribe latest.json a trozos, un trabajo cada vez, y apunta
      # a la API de GitHub (`/releases/assets/<id>`), que sin sesión deja 60
      # peticiones por hora. Antes de las sumas, se cambia cada URL por la de
      # descarga normal y se comprueba que estén todas las plataformas con su
      # firma: si falta una, esa plataforma no se enteraría nunca de la versión
      # nueva.
      - name: El latest.json del actualizador
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.json -D actualizador
          gh release view "$GITHUB_REF_NAME" --json assets > activos.json
          python3 - <<'EOF'
          import json, os, sys
          activos = json.load(open("activos.json"))["assets"]
          # Con la etiqueta y no la «url» de GitHub: en un borrador esa dice
          # untagged-…, y deja de valer al publicarlo.
          base = "https://github.com/webcafeina/Apolo/releases/download/" + os.environ["GITHUB_REF_NAME"]
          normal = {a["apiUrl"]: f"{base}/{a['name']}" for a in activos}
          nombres = {a["name"] for a in activos}
          j = json.load(open("actualizador/latest.json"))
          for clave, p in j["platforms"].items():
              p["url"] = normal.get(p["url"], p["url"])
              if p["url"].rsplit("/", 1)[-1] not in nombres or not p["signature"].strip():
                  sys.exit(f"{clave}: sin fichero o sin firma ({p['url']})")
          hacen_falta = [f"{s}-{a}" for s in ("darwin", "windows", "linux") for a in ("x86_64", "aarch64")]
          hacen_falta += [f"linux-{a}-{b}" for a in ("x86_64", "aarch64") for b in ("deb", "rpm", "appimage")]
          hacen_falta += [f"windows-{a}-nsis" for a in ("x86_64", "aarch64")]
          faltan = [c for c in hacen_falta if c not in j["platforms"]]
          if faltan:
              sys.exit(f"Faltan plataformas en latest.json: {faltan}")
          json.dump(j, open("actualizador/latest.json", "w"), indent=2)
          print(json.dumps({c: p["url"] for c, p in j["platforms"].items()}, indent=2))
          EOF
          gh release upload "$GITHUB_REF_NAME" actualizador/latest.json --clobber

      - name: CLI, notas y sumas
        run: |
          gh release upload "$GITHUB_REF_NAME" cli/* --clobber
          if [ -f ".github/notas/$GITHUB_REF_NAME.md" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file ".github/notas/$GITHUB_REF_NAME.md"
          fi
          mkdir todo
          gh release download "$GITHUB_REF_NAME" -D todo --skip-existing
          (cd todo && rm -f SHA256SUMS.txt && sha256sum * > ../SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          cp SHA256SUMS.txt todo/

      # La procedencia de cada fichero de la Release, firmada por GitHub: quién
      # lo compiló, desde qué commit y con qué workflow. Se comprueba con
      # `gh attestation verify <fichero> --repo webcafeina/Apolo` (ADR 0034).
      - name: Procedencia de los ficheros
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: todo/*
