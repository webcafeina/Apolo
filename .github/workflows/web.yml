# La web de Apolo (apolo.webcafeina.com, ADR 0026 y 0033): web/ es un proyecto de Astro que se
# compila aquí, con los datos de la última versión publicada (los ficheros, sus tamaños y sus
# sumas, que escribe este mismo flujo), y se publica con GitHub Pages. Las imágenes se hacen a mano
# con el propio Apolo (`make capturas-web`, `make video-web` y las herramientas de
# web/herramientas/) y van en git; los tokens, con `make tokens`.
#
# Pages está activado con «GitHub Actions» como origen y el dominio apolo.webcafeina.com en los
# ajustes del repositorio (2026-10-21); el registro DNS (CNAME a webcafeina.github.io) es del
# cliente, en Cloudflare, con su proxy delante desde el 2026-10-27 (ADR 0034: las cabeceras de
# seguridad, y /apt, /rpm y /aur sin caché). GTM_ID es una variable del repositorio: sin ella, la web no carga GTM ni
# enseña el aviso de cookies.
#
# Con la web van los repositorios APT y RPM de Linux (ADR 0030): /apt y /rpm, con los .deb y .rpm
# de la última versión publicada, firmados con la clave de los paquetes (PAQUETES_GPG_CLAVE, la
# misma que firma el .rpm). Los paquetes no se guardan en git: se bajan de la Release al desplegar,
# y por eso se despliega también al publicar una versión. Y en /aur, el PKGBUILD de apolo-bin.
name: Web

# Solo al publicar una versión, o a mano (ADR 0034): la web nueva sale con la 1.0.0, a la vez que
# la versión, y no al subir el cambio de sitio/ a web/. Tras el lanzamiento, se vuelve a desplegar
# también con cada cambio de web/ en main (push con paths: web/**, .github/notas/** y este fichero).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # Siempre main, también al publicar una versión: con la etiqueta se desplegaría la web que
      # había al etiquetar (trampas.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Los datos de la última versión
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.event.release.tag_name }}
        run: |
          etiqueta="${ETIQUETA:-$(gh release view --json tagName -q .tagName)}"
          echo "ETIQUETA=$etiqueta" >> "$GITHUB_ENV"
          gh release view "$etiqueta" --json tagName,publishedAt,assets \
            -q '{tagName, publishedAt, assets: [.assets[] | {name, size, url}]}' > web/src/datos/release.json
          gh release download "$etiqueta" -p SHA256SUMS.txt -D "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/SHA256SUMS.txt" web/src/datos/sumas.txt
      - name: La web
        env:
          PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
      # Después de compilar: Astro vacía dist/ al empezar.
      - name: Los paquetes de la última versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Paquetes de la $ETIQUETA"
          mkdir -p web/dist/apt/pool/main web/dist/rpm web/dist/aur
          gh release download "$ETIQUETA" -p '*.deb' -D web/dist/apt/pool/main
          gh release download "$ETIQUETA" -p '*.rpm' -D web/dist/rpm
          ls -la web/dist/apt/pool/main web/dist/rpm
          # El PKGBUILD de apolo-bin, relleno con esta versión, para Arch mientras el AUR no
          # admite cuentas nuevas (trampas.md): `makepkg -si`.
          python3 -I empaquetado/aur/rellenar.py "${ETIQUETA#v}" "$RUNNER_TEMP/SHA256SUMS.txt" web/dist/aur/PKGBUILD
      - name: La clave de los paquetes
        env:
          CLAVE: ${{ secrets.PAQUETES_GPG_CLAVE }}
          FRASE: ${{ secrets.PAQUETES_GPG_FRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gpg"
          install -m 700 -d "$GNUPGHOME"
          printf '%s\n' "$CLAVE" | gpg --batch --import 2> /dev/null
          printf '%s' "$FRASE" > "$RUNNER_TEMP/frase"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: El repositorio APT
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y apt-utils createrepo-c > /dev/null
          firmar() { gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/frase" "$@"; }
          cd web/dist/apt
          for a in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$a"
            apt-ftparchive --arch "$a" packages pool > "dists/stable/main/binary-$a/Packages"
            gzip -k9n "dists/stable/main/binary-$a/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Apolo \
            -o APT::FTPArchive::Release::Label=Apolo \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            -o "APT::FTPArchive::Release::Description=Apolo, de Webcafeína" \
            release dists/stable > dists/stable/Release
          firmar --clearsign -o dists/stable/InRelease dists/stable/Release
          firmar --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          printf '%s\n' \
            "Types: deb" \
            "URIs: https://apolo.webcafeina.com/apt" \
            "Suites: stable" \
            "Components: main" \
            "Architectures: amd64 arm64" \
            "Signed-By: /etc/apt/keyrings/apolo.asc" > apolo.sources
          cat dists/stable/main/binary-amd64/Packages
      - name: El repositorio RPM
        run: |
          cd web/dist/rpm
          createrepo_c --quiet .
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/frase" \
            --armor --detach-sign -o repodata/repomd.xml.asc repodata/repomd.xml
          printf '%s\n' \
            "[apolo]" \
            "name=Apolo" \
            "baseurl=https://apolo.webcafeina.com/rpm" \
            "enabled=1" \
            "gpgcheck=1" \
            "repo_gpgcheck=1" \
            "gpgkey=https://apolo.webcafeina.com/apolo.asc" > apolo.repo
          ls -la . repodata
      - name: Fuera la clave
        if: always()
        run: rm -rf "$RUNNER_TEMP/gpg" "$RUNNER_TEMP/frase"
      # Cada descarga que enlaza la web existe en la Release.
      - name: Los enlaces de descarga
        run: |
          grep -rhoE 'https://github\.com/webcafeina/Apolo/releases/download/[^"]+' web/dist --include=*.html | sort -u > "$RUNNER_TEMP/enlaces"
          wc -l < "$RUNNER_TEMP/enlaces"
          while read -r u; do curl -fsIL -o /dev/null "$u" || { echo "No responde: $u"; exit 1; }; done < "$RUNNER_TEMP/enlaces"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # IndexNow (ADR 0034): avisa a Bing, Yandex y los demás de todas las
      # páginas recién publicadas. ChatGPT busca sobre el índice de Bing. La
      # clave no es secreta: está publicada en la propia web, que es como
      # IndexNow comprueba que el aviso es nuestro. Si falla, no tumba nada.
      - name: Avisar a los buscadores
        continue-on-error: true
        env:
          CLAVE: 1283c6f1acc7f3c7d71dc2513d338e34
        run: |
          grep -oE '<loc>[^<]+' web/dist/sitemap.xml | sed 's/<loc>//' | python3 -c 'import json, os, sys
          c = os.environ["CLAVE"]
          urls = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps({"host": "apolo.webcafeina.com", "key": c, "keyLocation": "https://apolo.webcafeina.com/" + c + ".txt", "urlList": urls}))
          ' > "$RUNNER_TEMP/indexnow.json"
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @"$RUNNER_TEMP/indexnow.json"
