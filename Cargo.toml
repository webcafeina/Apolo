[workspace]
resolver = "3"
members = ["crates/nucleo", "crates/tema", "crates/cli", "crates/servicio", "crates/dev", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/webcafeina/Apolo"
authors = ["Webcafeína <info@webcafeina.com>"]

[workspace.dependencies]
apolo-nucleo = { path = "crates/nucleo" }
apolo-tema = { path = "crates/tema" }
apolo-servicio = { path = "crates/servicio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
