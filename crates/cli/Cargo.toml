[package]
name = "apolo-cli"
description = "apolo, la línea de comandos de Apolo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "apolo"
path = "src/main.rs"

[dependencies]
apolo-nucleo.workspace = true
apolo-avifjxl.workspace = true
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# MIT o Apache-2.0; ya lo usa el núcleo. Para devolver SIGPIPE a su sitio (main.rs).
libc = "0.2"

[build-dependencies]
# MIT. Ya lo trae tauri-build; aquí, para el manifiesto de Windows (build.rs).
embed-resource = "3"

[dev-dependencies]
# Las imágenes de las pruebas de vectorizar.
png = "0.18"
