[package]
name = "apolo-mcp"
description = "apolo-mcp: Apolo para agentes de IA por MCP (ADR 0023)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "apolo-mcp"
path = "src/main.rs"

[dependencies]
apolo-nucleo.workspace = true
apolo-servicio.workspace = true
apolo-avifjxl.workspace = true
# El SDK oficial de MCP para Rust (Apache-2.0). Fijado: la sintaxis de sus
# macros cambia entre versiones menores.
rmcp = { version = "=3.5.1", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-std", "io-util", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
dirs = "7"
base64 = "0.22"

[build-dependencies]
# MIT. Ya lo trae tauri-build; aquí, para el manifiesto de Windows (build.rs).
embed-resource = "3"
