[package]
name = "apolo-nucleo"
description = "El núcleo de Apolo: decodificar, codificar, procesar y medir imágenes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# La versión de libwebp queda fijada aquí (ADR 0002): cambiarla cambia los
# bytes de salida y obliga a subir el cwebp de referencia de las pruebas.
libwebp-sys = "=0.14.4"
# El decodificador de JPEG es el de libjpeg-turbo, el mismo que usa cwebp: con
# otro, los píxeles de partida cambian y la salida deja de ser idéntica.
mozjpeg = "0.10"
# El de mozjpeg, con jpeg_write_icc_profile (-icc). Sin codificación
# aritmética, como el cjpeg 4.1.5 oficial (WITH_ARITH_ENC viene apagado). La
# misma versión que usa el crate mozjpeg: si no, habría dos.
mozjpeg-sys = { version = "=2.2.3", features = ["icc_io"] }
libc = "0.2"
# PNG optimizado (ADR 0020). Sin el binario; con hilos y Zopfli, como el
# oxipng oficial. libdeflater y zopfli van fijadas en Cargo.lock a las del
# oxipng publicado (1.26.0 y 0.8.3): con otras, otros bytes.
oxipng = { version = "=10.2.1", default-features = false, features = ["parallel", "zopfli"] }
# El proceso (ADR 0020): redimensionar (MIT/Apache) y reducir la paleta con
# libimagequant, la de Squoosh (GPLv3, la de Apolo: ADR 0006).
fast_image_resize = "6.1.0"
imagequant = "4.4.1"
png = "0.18"
# HEIC (las fotos del iPhone), con libheif y libde265 compiladas dentro.
apolo-heic.workspace = true
tiff = "0.11"
image = { version = "0.25", default-features = false, features = ["gif", "bmp", "qoi", "pnm"] }
serde.workspace = true
serde_json.workspace = true
dirs = "6"
thiserror = "2"

[dev-dependencies]
miniz_oxide = "0.9"
