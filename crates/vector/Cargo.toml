[package]
name = "apolo-vector"
description = "Vectorizar imágenes en Apolo: de un mapa de bits a SVG, PDF, EPS y DXF (ADR 0038 y 0039)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# libimagequant, la de Squoosh (GPLv3, la de Apolo: ADR 0006), para la paleta de las fotos.
imagequant = "4.4.1"
# La vista previa y elegir entre candidatos: el SVG rasterizado (Apache-2.0 o MIT).
resvg = "0.49"
# Las formas de cada capa y los dos órdenes de capas, en paralelo (MIT o Apache-2.0; ya venía con imagequant).
rayon = "1.12"
# El contenido del PDF, comprimido con Deflate (MIT, Zlib o Apache-2.0; la misma que usa el núcleo).
miniz_oxide = "0.9"
