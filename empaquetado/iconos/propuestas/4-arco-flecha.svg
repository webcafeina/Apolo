<!--
  Propuesta 4 · Arco y flecha de luz.

  Apolo arquero, el que acierta de lejos. El arco tenso en oro y una flecha que
  vuela hasta clavarse en el centro de un encuadre, dibujado con las cuatro
  marcas de recorte de un fotógrafo: lo que hace la herramienta —ir a la imagen
  y quedarse con lo justo—, sin escribirlo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- La misma placa que Esfinge: así se leen como de la misma casa. -->
    <linearGradient id="piedra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#2b2b31"/>
    </linearGradient>
    <!-- El oro de Apolo es más solar que el de Esfinge (#f2c14e → #d99a28):
         más cálido abajo, para que los dos hermanos no se confundan en el Dock. -->
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd659"/>
      <stop offset="1" stop-color="#f08c1e"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.6" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#f08c1e"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#piedra)"/>
  <!-- El encuadre: las cuatro marcas de recorte, en crema. -->
  <g fill="none" stroke="#fff1d6" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 228H400V298"/><path d="M730 228H800V298"/>
    <path d="M800 558V628H730"/><path d="M470 628H400V558"/>
  </g>
  <!-- El arco y su cuerda, tensada hacia atrás. -->
  <path d="M250 330C160 500 178 720 330 840" fill="none" stroke="url(#sol)" stroke-width="66" stroke-linecap="round"/>
  <path d="M250 330L360 700L330 840" fill="none" stroke="#fff1d6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- La flecha, de la cuerda al centro del encuadre. -->
  <path d="M360 700L568 492" stroke="url(#sol)" stroke-width="40" stroke-linecap="round"/>
  <path d="M630 430L522 470L590 538Z" fill="url(#sol)" stroke="url(#sol)" stroke-width="26" stroke-linejoin="round"/>
  <!-- El destello donde se clava, en el centro de la imagen. -->
  <g stroke="#ffe9a3" stroke-width="20" stroke-linecap="round">
    <path d="M662 398L708 352"/><path d="M676 436L740 436"/><path d="M624 384L624 320"/>
  </g>
</svg>
