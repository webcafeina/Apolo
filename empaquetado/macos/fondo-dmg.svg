<!--
  Fondo de la ventana del .dmg (660×470), como build/darwin/fondo-dmg.svg de
  Esfinge. `make iconos` lo pasa a PNG a 1x y 2x; en el Mac de CI se unen en un
  TIFF HiDPI.

  El Finder pinta encima los dos iconos a 128 px —Apolo en (165, 220) y
  Aplicaciones en (495, 220), que son las posiciones de tauri.macos.conf.json— y
  sus nombres debajo, a 16 px. Esas zonas se dejan limpias.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Figtree:wght@400;600&amp;display=block");
      .titulo { font-family: Marcellus, Georgia, serif; }
      .texto { font-family: Figtree, "Helvetica Neue", Arial, sans-serif; }
    </style>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36363e"/>
      <stop offset="1" stop-color="#1f1f24"/>
    </linearGradient>
    <radialGradient id="aura" cx="330" cy="-60" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd659" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#f08c1e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f08c1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd659"/>
      <stop offset="1" stop-color="#f08c1e"/>
    </linearGradient>
  </defs>

  <rect width="660" height="470" fill="url(#fondo)"/>
  <!-- El sol, fuera de la ventana por arriba: solo se ven su luz y sus rayos. -->
  <g fill="#ffd659" opacity="0.07">
    <path d="M330 -60L881.8 35.3L872.9 77.4Z"/>
    <path d="M330 -60L714.9 108.1L706.2 126.7Z"/>
    <path d="M330 -60L784.2 267.6L757.7 301.5Z"/>
    <path d="M330 -60L602.2 259.8L586.3 272.8Z"/>
    <path d="M330 -60L594.6 433.5L556.0 452.4Z"/>
    <path d="M330 -60L434.4 346.8L414.5 351.4Z"/>
    <path d="M330 -60L351.5 499.6L308.5 499.6Z"/>
    <path d="M330 -60L245.5 351.4L225.6 346.8Z"/>
    <path d="M330 -60L104.0 452.4L65.4 433.5Z"/>
    <path d="M330 -60L73.7 272.8L57.8 259.8Z"/>
    <path d="M330 -60L-97.7 301.5L-124.2 267.6Z"/>
    <path d="M330 -60L-46.2 126.7L-54.9 108.1Z"/>
    <path d="M330 -60L-212.9 77.4L-221.8 35.3Z"/>
  </g>
  <rect width="660" height="470" fill="url(#aura)"/>

  <!-- La firma de la casa, como en Esfinge. -->
  <rect x="24" y="24" width="3" height="14" rx="1.5" fill="url(#oro)"/>
  <text x="34" y="35.5" class="texto" font-size="12" font-weight="600" fill="#cfcbc4" letter-spacing="0.4">webcafeína</text>

  <text x="330" y="70" text-anchor="middle" class="titulo" font-size="34" fill="#f6efe2" letter-spacing="1.5">Apolo</text>
  <text x="330" y="96" text-anchor="middle" class="texto" font-size="13" fill="#bdb8b0">Optimiza imágenes con los motores de Squoosh</text>

  <!-- «Arrastra»: del icono de Apolo a Aplicaciones. -->
  <text x="330" y="196" text-anchor="middle" class="texto" font-size="13" font-weight="600" fill="#ffd27a" letter-spacing="0.6">Arrastra</text>
  <path d="M252 222C292 206 368 206 406 222" fill="none" stroke="url(#oro)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M398 212L410 224L394 230" fill="none" stroke="#f3a133" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pie: el filete y cómo abrirlo la primera vez, que es lo que más se pregunta. -->
  <path d="M40 378H620" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="330" y="404" text-anchor="middle" class="texto" font-size="12" fill="#bdb8b0">La primera vez, macOS avisa porque Apolo no está firmado.</text>
  <text x="330" y="424" text-anchor="middle" class="texto" font-size="12" fill="#bdb8b0">Ábrelo y, en Ajustes del Sistema → Privacidad y seguridad, pulsa «Abrir igualmente».</text>
  <text x="330" y="450" text-anchor="middle" class="texto" font-size="11" fill="#8e8a84">Software libre · GPLv3</text>
</svg>
