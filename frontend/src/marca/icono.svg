<!--
  Icono de Apolo · Sol con corona de laurel.

  Elegido por el cliente el 2026-10-06 entre cuatro propuestas (están en
  empaquetado/iconos/propuestas/, y la ADR 0015 cuenta cómo se eligió).

  Apolo es el dios de la luz, y la luz es de lo que están hechas las imágenes.
  Un sol naciente —los rayos solo por arriba, largos y cortos alternos— y la
  corona de laurel, su atributo y el premio al mejor, abrazándolo por debajo.
  Hojas grandes y pocas: a 32 px tiene que quedar el disco con sus rayos y un
  arco claro debajo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- La misma placa que Esfinge: así se leen como de la misma casa. -->
    <linearGradient id="piedra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#2b2b31"/>
    </linearGradient>
    <!-- El oro de Apolo es más solar que el de Esfinge (#f2c14e → #d99a28):
         más cálido abajo, para que los dos hermanos no se confundan en el Dock. -->
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd659"/>
      <stop offset="1" stop-color="#f08c1e"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.6" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#f08c1e"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#piedra)"/>
  <g fill="url(#sol)">
    <path d="M294.0 460.0L142.0 500.0L294.0 540.0z"/>
