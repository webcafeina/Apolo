[package]
name = "apolo"
description = "Apolo, la aplicación de ventana"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "apolo_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apolo-nucleo.workspace = true
apolo-servicio.workspace = true
serde.workspace = true
serde_json.workspace = true
# macos-private-api: la ventana transparente con el vidrio de macOS lo exige
# (ADR 0016). Va con app.macOSPrivateApi en tauri.conf.json.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
