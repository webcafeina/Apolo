[package]
name = "apolo"
description = "Apolo, la aplicación de ventana"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "apolo_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apolo-nucleo.workspace = true
apolo-servicio.workspace = true
apolo-mcpb.workspace = true
serde.workspace = true
serde_json.workspace = true
# macos-private-api: la ventana transparente con el vidrio de macOS lo exige
# (ADR 0016). Va con app.macOSPrivateApi en tauri.conf.json.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# La ventana de Windows (ADR 0027): Mica, la versión del sistema (Mica solo
# desde Windows 11) y lo de Win32 para la ventana de Snap. Las tres, MIT o
# Apache-2.0, y en las versiones que ya trae Tauri: no se compila otra copia.
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows-version = "0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# La ventana de macOS (ADR 0028): Liquid Glass (NSGlassEffectView) en macOS 26
# y 27, o el material de barra lateral. El mismo crate que en Windows.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
